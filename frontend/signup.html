<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Créer un compte - AsCO₂</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="index.html" class="logo">AsCO<sub>2</sub></a>
      <button class="burger" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="#">Calculateur</a>
        <a href="methodologie.html">Méthodologie</a>
        <a href="#">Contact</a>
        <a href="login.html" class="nav-login">Connexion</a>
      </nav>
    </header>

    <main class="hero">
      <section class="hero-card signup-card">
        <h2>Créer un compte</h2>
        <p class="subtitle">Rejoignez AsCO<sub>2</sub>.</p>

        <form class="login-form" action="#" method="post">
          <div class="form-group">
            <label for="firstname">Prénom</label>
            <input
              type="text"
              id="firstname"
              name="firstname"
              placeholder="Prénom"
              autocomplete="given-name"
              required
              oninvalid="this.setCustomValidity('Veuillez saisir votre prénom.')"
              oninput="this.setCustomValidity('')"
            />
          </div>

          <div class="form-group">
            <label for="lastname">Nom</label>
            <input
              type="text"
              id="lastname"
              name="lastname"
              placeholder="Nom"
              autocomplete="family-name"
              required
              oninvalid="this.setCustomValidity('Veuillez saisir votre nom.')"
              oninput="this.setCustomValidity('')"
            />
          </div>

          <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="votre@email.fr"
              autocomplete="email"
              pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
              required
              oninvalid="this.setCustomValidity(this.value ? 'Veuillez saisir une adresse e-mail valide (ex : nom@domaine.fr).' : 'Veuillez saisir votre adresse e-mail.')"
              oninput="this.setCustomValidity('')"
            />
          </div>

          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
              oninvalid="this.setCustomValidity('Veuillez saisir un mot de passe.')"
              oninput="this.setCustomValidity('')"
            />
          </div>

          <div class="form-group">
            <label for="password-confirm">Confirmer le mot de passe</label>
            <input
              type="password"
              id="password-confirm"
              name="password_confirm"
              placeholder="••••••••"
              autocomplete="new-password"
              required
              oninput="this.setCustomValidity('')"
            />
          </div>

          <button type="submit" class="btn-submit">Créer mon compte</button>
        </form>

        <p class="login-footer-text">
          Déjà inscrit ? <a href="login.html">Se connecter</a>
        </p>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 AsCO<sub>2</sub> -
        Made with ❤ by
        <a href="https://github.com/erhel-czc/asco2" target="_blank">erhel-czc</a></p>
    </footer>

    <script src="./js/navbar.js" defer></script>
    <script src="./js/signup.js" defer></script>
  </body>
</html>
