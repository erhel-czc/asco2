{% extends "base.html" %}

{% block content %}
  <main class="page">
    <section class="card card--form-wide">
      <h2>Créer un compte</h2>
      <p class="subtitle">Rejoignez AsCO<sub>2</sub>.</p>

      <form class="login-form" action="#" method="post">
        <div class="form-group">
          <label for="firstname">Prénom</label>
          <input
            type="text"
            id="firstname"
            name="firstname"
            placeholder="Prénom"
            autocomplete="given-name"
            required
            oninvalid="this.setCustomValidity('Veuillez saisir votre prénom.')"
            oninput="this.setCustomValidity('')"
          />
        </div>

        <div class="form-group">
          <label for="lastname">Nom</label>
          <input
            type="text"
            id="lastname"
            name="lastname"
            placeholder="Nom"
            autocomplete="family-name"
            required
            oninvalid="this.setCustomValidity('Veuillez saisir votre nom.')"
            oninput="this.setCustomValidity('')"
          />
        </div>

        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="votre@email.fr"
            autocomplete="email"
            pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
            required
            oninvalid="this.setCustomValidity(this.value ? 'Veuillez saisir une adresse e-mail valide (ex : nom@domaine.fr).' : 'Veuillez saisir votre adresse e-mail.')"
            oninput="this.setCustomValidity('')"
          />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="new-password"
            required
            oninvalid="this.setCustomValidity('Veuillez saisir un mot de passe.')"
            oninput="this.setCustomValidity('')"
          />
        </div>

        <div class="form-group">
          <label for="password-confirm">Confirmer le mot de passe</label>
          <input
            type="password"
            id="password-confirm"
            name="password_confirm"
            placeholder="••••••••"
            autocomplete="new-password"
            required
            oninput="this.setCustomValidity('')"
          />
        </div>

        <button type="submit" class="btn-submit">Créer mon compte</button>
      </form>

      <p class="login-footer-text">
        Déjà inscrit ? <a href="/login">Se connecter</a>
      </p>
    </section>
  </main>
{% endblock %}

{% block scripts %}
  <script src="/static/js/signup.js" defer></script>
{% endblock %}
