{% extends "base.html" %}

{% block content %}
  <main class="page">
    <section class="card card--dashboard">
      <div class="dashboard-header">
        <div class="dashboard-header__text">
          <h2>Mes associations</h2>
          <p class="subtitle">Retrouvez les associations dont vous faites partie.</p>
        </div>
        <a href="" class="btn btn-primary" id="btn-add-association">+ Ajouter une association</a>
      </div>
      <p id="dashboard-status" class="login-footer-text" style="text-align:left; margin:0 0 0.5rem;">Chargement…</p>
      <div id="associations-grid" class="associations-grid"></div>
    </section>
  </main>

  <dialog class="modal" id="association-modal" aria-labelledby="association-modal-title">
    <form class="modal__content" id="association-form" method="dialog">
      <button class="modal__close" type="button" data-close-modal aria-label="Fermer">×</button>
      <h2 id="association-modal-title">Ajouter une association</h2>
      <p class="modal__description">Créez une association.</p>
      <p class="modal__error" id="association-form-error" role="alert"></p>
      <label for="association-name">Nom de l’association</label>
      <input id="association-name" name="association_name" required maxlength="40" />
      <label for="association-description">Description (facultatif)</label>
      <textarea id="association-description" name="association_description" maxlength="300" rows="4"></textarea>
      <div class="modal__actions">
        <button class="btn-cancel" type="button" data-close-modal>Annuler</button>
        <button class="btn btn-primary" type="submit">Créer l’association</button>
      </div>
    </form>
  </dialog>
{% endblock %}

{% block scripts %}
  <script src="/static/js/dashboard.js" defer></script>
{% endblock %}
