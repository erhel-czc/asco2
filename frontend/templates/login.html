{% extends "base.html" %}

{% block content %}
  <main class="page">
    <section class="card card--narrow">
      <h2>Connexion</h2>
      <p class="subtitle" style="font-size: 0.9rem;">Accédez à votre tableau de bord.</p>

      <form class="login-form" action="#" method="post">
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="votre@email.fr"
            autocomplete="email"
            pattern="[^@\s]+@[^@\s]+\.[^@\s]+"
            required
            oninvalid="this.setCustomValidity(this.value ? 'Veuillez saisir une adresse e-mail valide (ex : nom@domaine.fr).' : 'Veuillez saisir votre adresse e-mail.')"
            oninput="this.setCustomValidity('')"
          />
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            oninvalid="this.setCustomValidity('Veuillez saisir votre mot de passe.')"
            oninput="this.setCustomValidity('')"
          />
        </div>
        <button type="submit" class="btn-submit">Se connecter</button>
      </form>

      <p class="login-footer-text">
        Pas encore de compte ? <a href="/signup">Créer un compte</a>
      </p>
    </section>
  </main>
{% endblock %}

{% block scripts %}
  <script src="/static/js/login.js" defer></script>
{% endblock %}
