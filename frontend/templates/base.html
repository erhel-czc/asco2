<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="/static/style/style.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="/" class="logo">AsCO<sub>2</sub></a>
      <button class="burger" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav>
        <a href="/" {% if active_page == "home" %}aria-current="page"{% endif %}>Accueil</a>
        <a
          href="/methodologie"
          {% if active_page == "methodologie" %}aria-current="page"{% endif %}
        >Méthodologie</a>
        <a href="#">Contact</a>
        <a
          href="/login"
          class="nav-login"
          {% if active_page == "login" %}aria-current="page"{% endif %}
        >Connexion</a>
      </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="footer">
      <p>
        &copy; 2026 AsCO<sub>2</sub> -
        Made with ❤ by
        <a href="https://github.com/erhel-czc/asco2" target="_blank">erhel-czc</a>
      </p>
    </footer>

    <script src="/static/js/navbar.js" defer></script>
    {% if dev_auto_reload %}
      <!-- Dev-only: poll backend revision and reload page when template/style/js files change. -->
      <script>
        (() => {
          const endpoint = "/__dev/revision";
          const pollMs = 1000;
          let lastRevision = null;

          const checkRevision = async () => {
            const response = await fetch(endpoint, { cache: "no-store" });
            if (!response.ok) return;

            const payload = await response.json();
            const revision = Number(payload.revision);
            if (!Number.isFinite(revision)) return;

            if (lastRevision === null) {
              lastRevision = revision;
              return;
            }

            if (revision > lastRevision) {
              window.location.reload();
              return;
            }

            lastRevision = revision;
          };

          checkRevision();
          setInterval(checkRevision, pollMs);
        })();
      </script>
    {% endif %}
    {% block scripts %}{% endblock %}
  </body>
</html>
